[item-description]
magmothermic-reactor=Использует магму в качестве источника тепла для нагрева воды и производства пара. Высокая температура магмы позволяет получать значительное количество перегретого пара.
magmothermic-turbine=Преобразует энергию перегретого пара в электричество. Рассчитана на работу с паром, полученным из магмотермических реакторов.
magmatic-fuel-cell-full=Топливная ячейка, заполненная магмой. Используется в магмотермических реакторах для получения перегретого пара.
magmatic-fuel-cell-empty=Вольфрамовая топливная ячейка, предназначенная для наполнения магмой.
magmatic-fuel=Исследования магмы на Вулканусе позволили использовать чистую магму в качестве топлива. Выделяет огромное количество тепла при сгорании.

